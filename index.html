<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Random quote generator — BCA final year project" />
  <title>Quote Generator | BCA Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Quote Generator</h1>
    <p class="subtitle">Final Year BCA Project</p>
  </header>

  <main class="container">
    <article class="quote-card" id="card-element" aria-labelledby="quote-heading">
      <h2 id="quote-heading" class="visually-hidden">Inspirational quote</h2>

      <div class="overlay" aria-hidden="true"></div>

      <div class="utility-actions">
        <button type="button" id="btn-speak" aria-label="Read quote aloud" title="Read aloud">&#128266;</button>
        <button type="button" id="btn-copy" aria-label="Copy quote" title="Copy">&#128203;</button>
        <button type="button" id="btn-share" aria-label="Share link" title="Share">&#8599;</button>
      </div>

      <div class="content-area">
        <p class="quote-text" id="quote-display"></p>
        <p class="quote-author" id="author-display"></p>
      </div>

      <div class="navigation-matrix">
        <button type="button" class="nav-btn" id="btn-prev">&larr; Previous</button>
        <button type="button" class="nav-btn" id="btn-next">Next &rarr;</button>
      </div>
    </article>
  </main>

  <div id="chronometer-hub" aria-live="polite">
    <span aria-hidden="true">&#128337;</span>
    <time id="live-chronometer"></time>
  </div>

  <script src="script.js"></script>
</body>
</html>
