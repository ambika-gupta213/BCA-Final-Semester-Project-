<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Random quote generator — BCA final year project" />
  <title>Quote Generator | BCA Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Quote Generator</h1>
    <p>Final Year BCA Project</p>
  </header>

  <main class="main-content">
    <article class="quote-card" aria-labelledby="quote-heading">
      <h2 id="quote-heading" class="visually-hidden">Inspirational quote</h2>

      <figure class="quote-figure">
        <blockquote>
          <p id="quote-text">Your inspirational quote will appear here.</p>
        </blockquote>
        <figcaption>
          <cite id="quote-author">&mdash; Author Name</cite>
        </figcaption>
      </figure>

      <div class="btn-container">
        <button type="button" id="prev-quote" class="btn btn-prev">Previous</button>
        <button type="button" id="next-quote" class="btn btn-next">Next</button>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> BCA Project. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
